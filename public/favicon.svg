<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0070f2"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <g opacity="0.4" stroke="url(#nexusGrad)" stroke-width="1.5" fill="none">
    <polygon points="64,16 104,39 104,89 64,112 24,89 24,39" stroke-dasharray="4,4"/>
  </g>

  <circle cx="64" cy="16" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="104" cy="39" r="3" fill="#818cf8"/>
  <circle cx="104" cy="89" r="3.5" fill="#0070f2" filter="url(#glow)"/>
  <circle cx="64" cy="112" r="3" fill="#a855f7"/>
  <circle cx="24" cy="89" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="24" cy="39" r="3" fill="#0070f2"/>

  <polygon points="64,26 96,44.5 96,83.5 64,102 32,83.5 32,44.5" 
           fill="#0b1528" 
           stroke="url(#nexusGrad)" 
           stroke-width="3" 
           filter="url(#glow)"/>

  <path d="M 46 42 L 53 42 L 53 86 L 46 86 Z" fill="url(#nexusGrad)"/>
  <path d="M 49 42 L 57 42 L 79 86 L 71 86 Z" fill="url(#pulseGrad)" filter="url(#glow)"/>
  <path d="M 75 42 L 82 42 L 82 86 L 75 86 Z" fill="url(#nexusGrad)"/>

  <circle cx="64" cy="64" r="5" fill="#ffffff" filter="url(#coreGlow)"/>
  <circle cx="64" cy="64" r="3" fill="#38bdf8"/>
  
  <line x1="64" y1="54" x2="64" y2="74" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="54" y1="64" x2="74" y2="64" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
</svg>
